name: Terminpruefung

on:
  schedule:
    - cron: "*/10 * * * *"   # alle 10 Minuten (GitHub kann um einige Minuten verzoegern)
  workflow_dispatch:
    inputs:
      test:
        description: "Nur Testnachricht senden"
        type: boolean
        default: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Termin pruefen
        run: python termin_check.py
        env:
          PORTAL_URL: ${{ secrets.PORTAL_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TERMINART: ${{ secrets.TERMINART }}
          KEINE_TERMINE_HINWEIS: ${{ secrets.KEINE_TERMINE_HINWEIS }}
          NUR_TEST: ${{ inputs.test && '1' || '0' }}
